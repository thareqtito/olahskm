<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OlahSKM KPU Pacitan</title>
<meta name="description" content="Alat bantu olah data Survei Kepuasan Masyarakat (SKM) KPU Kabupaten Pacitan: dashboard, pengolahan data, file responses, dan generator laporan Word.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar kiri (menu) + area kerja; di ponsel sidebar menjadi bilah tab atas */
:root {
  /* Tema terang tunggal: latar putih, teks gelap berkontras tinggi */
  --bg: #ffffff; --panel: #ffffff; --ink: #111111; --muted: #364240; --line: #cfdcda; --line2: #eef5f4; --grid: #b9cac7;
  --accent: #0a8079; --accent-ink: #ffffff; --accent-soft: #dff4f2; --accent-2: #075a55;
  --good: #146c43; --good-soft: #e3f3ea; --warn: #7a5300; --warn-soft: #fbf1d6; --bad: #a3201a; --bad-soft: #fde7e5;
  --sel: rgba(10, 128, 121, .12); --sel-line: #0a8079; --grid-head: #eef6f5; color-scheme: light;
  --f-ui: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 10px; --shadow: 0 1px 2px rgba(6, 50, 46, .06), 0 4px 16px rgba(6, 50, 46, .05);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
.num, td.n, .tnum { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand-mark { width: 38px; height: 38px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: .02em; }
.brand b { display: block; font-size: 16px; letter-spacing: -.01em; }
.brand small { color: var(--muted); font-size: 11.5px; line-height: 1.25; display: block; }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--muted); font-weight: 600; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { background: var(--line2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav .count { margin-left: auto; font: 600 11px var(--f-num); background: var(--line2); color: var(--muted); padding: 1px 7px; border-radius: 99px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--muted); padding: 0 6px; }
.side-foot .save { display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; }
.dot.busy { background: var(--warn); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.topbar > div:first-child { flex: 1 1 280px; min-width: 0; }
.topbar h1 { font-size: 19px; letter-spacing: -.015em; }
.topbar .sub { color: var(--muted); font-size: 12.5px; }
.topbar .spacer { flex: 1; }
.period { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 3px 4px 3px 12px; }
.period label { font-size: 12px; color: var(--muted); }
.period select { border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 700; border-radius: 99px; padding: 4px 8px; cursor: pointer; }
.content { padding-block: 22px 60px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; min-width: 0; }

.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--line2); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card > h2, .sec-h { font-size: 15px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card > h2 small, .sec-h small { font-weight: 500; color: var(--muted); font-size: 12px; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.card-h h2 { font-size: 15px; }
.card-h .spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }

/* KPI */
.kpis { display: grid; grid-template-columns: 1.4fr repeat(2, minmax(0, 1fr)); gap: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { padding: 16px 18px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi:first-child { border-left: 0; background: var(--accent); color: var(--accent-ink); }
.kpi:first-child .eyebrow, .kpi:first-child .k-sub { color: color-mix(in srgb, var(--accent-ink) 78%, transparent); }
.kpi .k-val { font: 700 30px/1.1 var(--f-num); letter-spacing: -.02em; }
.kpi:first-child .k-val { font-size: 42px; }
.kpi .k-sub { font-size: 12px; color: var(--muted); }
.mutu { display: inline-grid; place-items: center; min-width: 26px; height: 22px; padding: 0 6px; border-radius: 6px; font: 700 12px var(--f-num); background: var(--good-soft); color: var(--good); }
.mutu.B { background: var(--warn-soft); color: var(--warn); }
.mutu.C, .mutu.D { background: var(--bad-soft); color: var(--bad); }
.kpi:first-child .mutu { background: var(--accent-ink); color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--line2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }

/* tabel data */
.tw { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; width: 100%; font-size: 12.5px; border: 1px solid var(--grid); }
table.t th, table.t td { padding: 6px 9px; border: 1px solid var(--grid); text-align: left; vertical-align: top; }
table.t th { background: var(--grid-head); font-weight: 700; font-size: 11.5px; color: var(--ink); white-space: nowrap; }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t td.c, table.t th.c { text-align: center; }
table.t tr.tot td { font-weight: 700; background: var(--line2); }
table.t td:first-child { min-width: 150px; }
table.t.compact td:first-child { min-width: 0; }
table.t.compact td, table.t.compact th { padding: 4px 7px; }
.bar { position: relative; height: 8px; background: var(--line2); border-radius: 99px; min-width: 60px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.pv-row td:last-child { width: 32%; }

.chart-box { position: relative; height: 280px; }
.chart-box.tall { height: 320px; }

/* Pengolahan */
table.olah { border-collapse: separate; border-spacing: 0; font-size: 11.5px; table-layout: fixed; width: 100%; min-width: 1226px; }
table.olah.ringkas { min-width: 900px; }
table.olah th, table.olah td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 3px 5px; line-height: 1.3; overflow-wrap: normal; word-break: normal; }
table.olah thead th { font-size: 10.5px; line-height: 1.2; padding: 3px 2px; }
table.olah tfoot td { white-space: nowrap; padding: 4px 1px; font-size: 11px; }
table.olah tfoot td.big { font-size: 13px; }
table.olah td.p, table.olah td.c { text-align: center; }
table.olah thead th { background: var(--grid-head); position: sticky; z-index: 2; font-size: 11px; color: var(--ink); text-align: center; }
table.olah thead tr:nth-child(1) th { top: 0; }
table.olah thead tr:nth-child(2) th { top: 34px; }
table.olah thead tr:nth-child(1) th { height: 34px; }
table.olah td.p { text-align: center; font-family: var(--f-num); padding: 3px 2px; }
table.olah td.p.bad { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
table.olah tfoot td { background: var(--line2); font-weight: 700; font-family: var(--f-num); text-align: center; }
table.olah tfoot td.lbl { text-align: left; font-family: var(--f-ui); padding-left: 8px; }
table.olah tfoot td.big { font-size: 13px; }
table.olah td.none { text-align: center; color: var(--muted); padding: 14px; }
.olah-wrap.short { max-height: none; }
.olah-sec { display: flex; flex-direction: column; gap: 16px; }
table.olah .salah { color: var(--bad); font-weight: 700; }
table.olah .benar { color: var(--good); }
.olah-wrap { max-height: 64vh; overflow: auto; border-top: 1px solid var(--grid); border-left: 1px solid var(--grid); }

/* Grid File Responses */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .spacer { flex: 1; }
.toolbar input[type="search"] { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; width: 200px; max-width: 100%; }
.sheet-wrap { height: 62vh; min-height: 320px; overflow: auto; border-top: 1px solid var(--grid); border-left: 1px solid var(--grid); background: var(--panel); outline: none; position: relative; }
.sheet-wrap:focus-within, .sheet-wrap:focus { border-color: var(--muted); }
table.sheet { border-collapse: separate; border-spacing: 0; font-size: 12.5px; table-layout: fixed; user-select: none; }
table.sheet th, table.sheet td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); height: 28px; padding: 0 7px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
table.sheet thead th { position: sticky; top: 0; z-index: 3; background: var(--grid-head); font-weight: 600; font-size: 11px; color: var(--muted); text-align: left; }
table.sheet thead th .lt { font: 700 10px var(--f-num); color: var(--accent); margin-right: 5px; }
table.sheet th.rn, table.sheet td.rn { position: sticky; left: 0; z-index: 2; background: var(--grid-head); text-align: right; font: 11px var(--f-num); color: var(--muted); width: 48px; padding: 0 8px 0 4px; cursor: pointer; }
table.sheet thead th.rn { z-index: 4; }
table.sheet td.cell { cursor: cell; }
table.sheet td.cell.in { background: var(--sel); }
table.sheet td.cell.act { box-shadow: inset 0 0 0 2px var(--sel-line); background: var(--panel); }
table.sheet td.cell.act.in { background: var(--sel); }
table.sheet td.cell.bad { color: var(--bad); background: var(--bad-soft); }
table.sheet td.st { text-align: center; width: 64px; position: sticky; right: 0; background: var(--panel); border-left: 1px solid var(--grid); }
table.sheet thead th.st { right: 0; z-index: 4; text-align: center; }
table.sheet tr.hid { display: none; }
table.sheet td input.ed { width: 100%; height: 26px; border: 0; outline: 0; background: transparent; padding: 0; font: inherit; }
.sheet-status { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.sheet-status b { color: var(--ink); font-family: var(--f-num); }

.empty { text-align: center; padding: 44px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 17px; }
.empty p { max-width: 520px; margin: 0; }
.empty .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.callout { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); background: var(--line2); }
.callout b { color: var(--ink); }
.callout.warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); color: var(--warn); }

/* Form laporan */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { border: 0; background: transparent; padding: 9px 14px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.gen-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.gen-aside { position: sticky; top: 78px; display: flex; flex-direction: column; gap: 14px; }
details.sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
details.sec + details.sec { margin-top: 12px; }
details.sec > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .chev { margin-left: auto; transition: transform .15s; color: var(--muted); }
details.sec[open] > summary .chev { transform: rotate(90deg); }
details.sec > summary .bab { font: 700 11px var(--f-num); color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 5px; }
.sec-body { padding: 4px 18px 18px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--line2); }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > label, .fld-h { font-weight: 700; font-size: 12.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fld > label .hint, .hint { font-weight: 500; color: var(--muted); font-size: 12px; }
.fld textarea, .fld input[type="text"], .fld input[type="number"], .fld select, .inp { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; width: 100%; line-height: 1.55; }
.fld textarea { min-height: 96px; resize: vertical; }
.fld textarea.auto { color: var(--muted); }
.fld textarea:focus, .fld input:focus, .inp:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 0; border-color: var(--accent); }
.subhead { font-size: 13px; font-weight: 800; padding-top: 6px; border-top: 1px dashed var(--line); margin-top: 4px; color: var(--accent-2); }
.row-ed { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.row-ed-h { display: flex; align-items: center; gap: 8px; }
.row-ed-h b { font: 700 12px var(--f-num); color: var(--accent); }
.row-ed-h .spacer { flex: 1; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.thumb { width: 120px; display: flex; flex-direction: column; gap: 4px; }
.thumb img { width: 120px; height: 90px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--line2); }
.thumb .x { display: flex; gap: 2px; }
.cover-prev { width: 150px; aspect-ratio: 210 / 297; max-width: 100%; border: 1px dashed var(--line); border-radius: 6px; background: var(--line2) center/cover no-repeat; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 8px; }
.logo-prev { width: 90px; height: 90px; border: 1px dashed var(--line); border-radius: 6px; background: var(--line2) center/contain no-repeat; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
.uprow { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.lamp-item { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.lamp-item img { width: 110px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.rank { display: grid; grid-template-columns: 28px 36px minmax(0, 1fr) 64px 30px; gap: 8px; align-items: center; font-size: 12.5px; padding: 5px 8px; border-radius: 6px; }
.rank:nth-child(odd) { background: var(--line2); }
.rank .rk { font: 700 12px var(--f-num); color: var(--muted); }
.rank .v { font-family: var(--f-num); text-align: right; }
.rank.top .rk { color: var(--good); } .rank.low .rk { color: var(--bad); }
.check { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.check div { display: flex; gap: 8px; align-items: flex-start; }
.check .i { width: 16px; height: 16px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 800; margin-top: 2px; }
.check .i.ok { background: var(--good-soft); color: var(--good); }
.check .i.no { background: var(--warn-soft); color: var(--warn); }
.saran-list { max-height: 260px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.saran-list div { font-size: 12.5px; padding: 7px 9px; border: 1px solid var(--line2); border-radius: 6px; display: flex; gap: 8px; align-items: flex-start; }
.saran-list div span { flex: 1; }
.saran-list small { color: var(--muted); display: block; }
.twbox { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; }
.twbox label { display: flex; gap: 4px; align-items: center; }

.toast { position: fixed; z-index: 50; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.confirm { display: inline-flex; gap: 6px; align-items: center; background: var(--bad-soft); color: var(--bad); padding: 4px 6px 4px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600; }
.busy-ov { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; place-items: center; font-weight: 700; }
.legend-note { font-size: 12px; color: var(--muted); }
.kbd { font: 11px var(--f-num); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }

@media (max-width: 1100px) {
  .gen-layout { grid-template-columns: minmax(0, 1fr); }
  .gen-aside { position: static; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:first-child { grid-column: 1 / -1; }
  .kpi { border-top: 1px solid var(--line); }
  .kpi:nth-child(2n) { border-left: 0; }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); gap: 10px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand small, .side-foot { display: none; }
  .nav { flex-direction: row; gap: 2px; }
  .nav button span.lbl { display: none; }
  .nav button { padding: 8px 10px; }
  .topbar, .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .grid2, .grid3, .cols2, .cols3 { grid-template-columns: minmax(0, 1fr); }
  .kpi .k-val { font-size: 24px; } .kpi:first-child .k-val { font-size: 34px; }
  .lamp-item { grid-template-columns: 80px minmax(0, 1fr); }
  .lamp-item img { width: 80px; height: 60px; }
  .lamp-item .x { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Tabel per jenis layanan — meniru warna sheet Excel */
.xl-wrap { overflow-x: auto; max-width: 100%; }

<div id="app"><div style="padding:40px;font-family:system-ui">Memuat OlahSKM…</div></div>
<noscript>Aplikasi ini memerlukan JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

<script>
/* ====================================================================
   OlahSKM — mesin hitung SKM (PermenPANRB No. 14 Tahun 2017)
   Murni fungsi, tanpa DOM: dipakai aplikasi dan diuji di Node.
   ==================================================================== */
var SKM = (function () {
  'use strict';

  /* ---------- Kolom Form Responses (A..AD) ---------- */
  var COLS = [
    { key: 'timestamp', label: 'Timestamp', w: 150 },
    { key: 'email', label: 'Email', w: 200 },
    { key: 'nama', label: 'Nama', w: 170 },
    { key: 'domisili', label: 'Domisili (Kab/Kota, Kecamatan, Desa/Kel)', w: 240 },
    { key: 'tgl', label: 'Tanggal Survei', w: 105 },
    { key: 'jam', label: 'Jam Survei', w: 80 },
    { key: 'jk', label: 'Jenis Kelamin', w: 105 },
    { key: 'pendidikan', label: 'Pendidikan', w: 120 },
    { key: 'usia', label: 'Usia', w: 100 },
    { key: 'pekerjaan', label: 'Pekerjaan', w: 150 },
    { key: 'disab', label: 'Penyandang/pendamping disabilitas?', w: 110 },
    { key: 'jenisDisab', label: 'Jenis disabilitas', w: 150 },
    { key: 'layanan', label: 'Jenis layanan yang diterima', w: 230 }
  ];
  var QUESTIONS = [
    'Informasi pelayanan tersedia melalui media elektronik maupun non-elektronik',
    'Kesesuaian persyaratan layanan dengan informasi yang diberikan',
    'Standar dan prosedur layanan diinformasikan dengan jelas',
    'Prosedur/alur layanan mudah dipahami dan dilakukan',
    'Layanan diberikan sesuai prosedur tanpa kecurangan',
    'Kesesuaian jangka waktu layanan dengan yang diinformasikan',
    'Kesesuaian biaya layanan dengan yang diinformasikan',
    'Pelayanan bebas dari pungutan liar (pungli)',
    'Pelayanan bebas dari percaloan/perantara tidak resmi',
    'Kesesuaian produk layanan dengan yang dipublikasikan',
    'Aplikasi sistem pelayanan merespon kebutuhan dengan cepat',
    'Fitur aplikasi sistem layanan mudah digunakan',
    'Seluruh pengguna layanan dilayani adil tanpa diskriminasi',
    'Pelayanan tanpa imbalan uang, barang, atau fasilitas di luar aturan',
    'Layanan konsultasi dan pengaduan mudah diakses',
    'Sistem layanan online nyaman dan mudah digunakan'
  ];
  QUESTIONS.forEach(function (q, i) { COLS.push({ key: 'p' + (i + 1), label: (i + 1) + '. ' + q, w: 118, q: i }); });
  COLS.push({ key: 'saran', label: 'Saran dan Masukan', w: 300 });

  function colLetter(i) { var s = ''; i++; while (i > 0) { var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - m) / 26); } return s; }
  COLS.forEach(function (c, i) { c.letter = colLetter(i); });
  var Q0 = 13; // indeks kolom N (P1)

  /* ---------- Unsur pelayanan (9) ---------- */
  var UNSUR = [
    { k: 'U1', short: 'Persyaratan', name: 'Persyaratan', items: [0, 1],
      desc: 'Persyaratan yang harus dipenuhi dalam memperoleh pelayanan, baik teknis maupun administratif.' },
    { k: 'U2', short: 'Prosedur', name: 'Sistem, Mekanisme, dan Prosedur', items: [2, 3, 4],
      desc: 'Kemudahan tahapan pelayanan yang diberikan kepada masyarakat, dilihat dari sisi kesederhanaan alur pelayanan.' },
    { k: 'U3', short: 'Waktu', name: 'Waktu Penyelesaian', items: [5],
      desc: 'Target waktu penyelesaian pelayanan sesuai dengan standar yang telah ditetapkan.' },
    { k: 'U4', short: 'Biaya', name: 'Biaya/Tarif', items: [6, 7, 8],
      desc: 'Keterjangkauan biaya atau tarif terhadap kemampuan masyarakat serta kesesuaian dengan ketentuan yang berlaku.' },
    { k: 'U5', short: 'Produk', name: 'Produk, Spesifikasi, dan Jenis Pelayanan', items: [9],
      desc: 'Kesesuaian antara hasil pelayanan yang diberikan dengan standar yang telah ditetapkan.' },
    { k: 'U6', short: 'Kompetensi', name: 'Kompetensi Pelaksana', items: [10],
      desc: 'Kemampuan dan keterampilan petugas dalam memberikan pelayanan kepada masyarakat.' },
    { k: 'U7', short: 'Perilaku', name: 'Perilaku Pelaksana', items: [11, 12, 13],
      desc: 'Sikap petugas dalam memberikan pelayanan, seperti kesopanan, keramahan, dan kesediaan membantu.' },
    { k: 'U8', short: 'Aduan', name: 'Penanganan Pengaduan, Saran, dan Masukan', items: [14],
      desc: 'Tindak lanjut terhadap pengaduan, saran, dan masukan dari masyarakat terkait penyelenggaraan pelayanan.' },
    { k: 'U9', short: 'Sarpras', name: 'Sarana dan Prasarana', items: [15],
      desc: 'Ketersediaan dan kondisi sarana serta prasarana pendukung pelayanan.' }
  ];
  var ITEM_UNSUR = []; UNSUR.forEach(function (u, ui) { u.items.forEach(function (i) { ITEM_UNSUR[i] = ui; }); });
  // Rincian Nilai pada template: SPAK = P5, P8, P9, P13, P14 ; SPKP = 11 item lainnya
  var SPAK_ITEMS = [4, 7, 8, 12, 13];
  var SPKP_ITEMS = [0, 1, 2, 3, 5, 6, 9, 10, 11, 14, 15];

  /* ---------- Jenis layanan per triwulan ---------- */
  var LAYANAN_4 = ['Layanan PPID', 'Layanan Pendidikan Pemilih', 'Layanan Pengaduan Masyarakat', 'Layanan Kerjasama'];
  var LAYANAN_6 = LAYANAN_4.concat(['Layanan Pemutakhiran Data Pemilih', 'Layanan Verifikasi dan Pemutakhiran Data Partai Politik']);
  var LAYANAN_TW = { 1: LAYANAN_4, 2: LAYANAN_6, 3: LAYANAN_4, 4: LAYANAN_6 };
  var BULAN_TW = { 1: ['Januari', 'Maret'], 2: ['April', 'Juni'], 3: ['Juli', 'September'], 4: ['Oktober', 'Desember'] };
  var ROMAWI = { 1: 'I', 2: 'II', 3: 'III', 4: 'IV' };
  var BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/pemuktahiran/g, 'pemutakhiran').replace(/[^a-z0-9]/g, ''); }
  /* Pemetaan sub-layanan ke Jenis Layanan Publik KPU (rumus kolom AX template) */
  var SUB_LAYANAN = {
    audiensi: 'Layanan Kerjasama', konsultasidankoordinasi: 'Layanan Kerjasama',
    datadaninformasi: 'Layanan PPID', pengaduanpelayananpublik: 'Layanan Pengaduan Masyarakat',
    permohonannarasumber: 'Layanan Pendidikan Pemilih', sosialisasi: 'Layanan Pendidikan Pemilih'
  };
  function canonLayanan(name, list) {
    var n = norm(name); if (!n) return '';
    if (SUB_LAYANAN[n]) return SUB_LAYANAN[n];
    var all = (list || []).concat(LAYANAN_6);
    for (var i = 0; i < all.length; i++) if (norm(all[i]) === n) return all[i];
    return String(name).trim();
  }

  /* ---------- Skor jawaban ----------
     Skala IKM PermenPANRB 14/2017: 4 = Sangat setuju/Sangat sesuai (terbaik),
     3 = Setuju/Sesuai, 2 = Tidak setuju/Tidak sesuai, 1 = Sangat tidak setuju/Sangat tidak sesuai. */
  function score(v) {
    if (v == null) return null;
    var s = String(v).trim().toLowerCase().replace(/\s+/g, ' ');
    if (!s) return null;
    if (/^[1-4]([.,]0+)?$/.test(s)) return parseInt(s, 10);
    if (/^\d+([.,]\d+)?$/.test(s)) return parseFloat(s.replace(',', '.')); // >4 → ditandai Salah oleh checklist
    if (/^sangat tidak/.test(s)) return 1;
    if (/^(tidak|kurang)/.test(s)) return 2;
    if (/^sangat/.test(s)) return 4;
    if (/^(setuju|sesuai|baik|puas|mudah|cepat|jelas|ya)/.test(s)) return 3;
    return NaN; // jawaban tak dikenal
  }
  var SCORE_LABEL = { 4: 'Sangat setuju / Sangat sesuai', 3: 'Setuju / Sesuai', 2: 'Tidak setuju / Tidak sesuai', 1: 'Sangat tidak setuju / Sangat tidak sesuai' };

  /* ---------- Mutu ---------- */
  function mutu4(v) { if (v == null || isNaN(v)) return ''; return v >= 3.5324 ? 'A' : v >= 3.0644 ? 'B' : v >= 2.6 ? 'C' : v >= 1 ? 'D' : ''; }
  function mutuK(k) { return k == null || isNaN(k) ? '' : mutu4(k / 25); }
  var MUTU_LABEL = { A: 'Sangat Baik', B: 'Baik', C: 'Kurang Baik', D: 'Tidak Baik' };

  function isRowEmpty(r) { for (var i = 0; i < COLS.length; i++) if (r[i] != null && String(r[i]).trim() !== '') return false; return true; }
  /* Baris responden = ada isi di kolom A–M (identitas). Baris rekap angka di bawah tabel (hanya kolom N–AC) diabaikan. */
  function isDataRow(r) { for (var i = 0; i < 13; i++) if (r[i] != null && String(r[i]).trim() !== '') return true; return false; }

  /* ---------- Baris pengolahan per responden ---------- */
  function processRow(r, layananList) {
    var ya = /^y/i.test(String(r[10] || '').trim());
    var vals = []; for (var i = 0; i < 16; i++) vals.push(score(r[Q0 + i]));
    var ok = vals.every(function (v) { return typeof v === 'number' && !isNaN(v) && v >= 1 && v <= 4; });
    return {
      layanan: canonLayanan(r[12], layananList),
      jk: String(r[6] || '').trim(), pendidikan: String(r[7] || '').trim(), pekerjaan: String(r[9] || '').trim(),
      usia: String(r[8] || '').trim(),
      disab: String(r[10] || '').trim() === '' ? '' : (ya ? 'Disabilitas' : 'Non Disabilitas'),
      jenisDisab: ya ? String(r[11] || '').trim() : '',
      saran: String(r[29] || '').trim(), nama: String(r[2] || '').trim(),
      p: vals, ok: ok
    };
  }

  function mean(a) { var s = 0, n = 0; a.forEach(function (v) { if (typeof v === 'number' && !isNaN(v)) { s += v; n++; } }); return n ? s / n : null; }

  /* Hitung blok seperti sheet "Pengolahan Data OPP 16 Pertanyaan" */
  function computeBlock(recs) {
    var total = [], avg = [];
    for (var i = 0; i < 16; i++) {
      var s = 0, n = 0;
      recs.forEach(function (r) { var v = r.p[i]; if (typeof v === 'number' && !isNaN(v)) { s += v; n++; } });
      total.push(s); avg.push(n ? s / n : null);
    }
    var unsur = UNSUR.map(function (u) { return mean(u.items.map(function (i) { return avg[i]; })); });
    var ikm4 = mean(unsur);
    var spkp4 = mean(SPKP_ITEMS.map(function (i) { return avg[i]; }));
    var spak4 = mean(SPAK_ITEMS.map(function (i) { return avg[i]; }));
    return {
      n: recs.length, total: total, avg: avg, unsur: unsur,
      unsurK: unsur.map(function (v) { return v == null ? null : v * 25; }),
      kategori: unsur.map(mutu4),
      ikm4: ikm4, ikm: ikm4 == null ? null : ikm4 * 25, mutu: mutu4(ikm4),
      spkp4: spkp4, spkp: spkp4 == null ? null : spkp4 * 25,
      spak4: spak4, spak: spak4 == null ? null : spak4 * 25,
      invalid: recs.filter(function (r) { return !r.ok; }).length
    };
  }

  /* Pivot hitung + persen, urutan mengikuti preferensi lalu kemunculan */
  var ORDER = {
    jk: ['Laki-Laki', 'Perempuan'],
    pendidikan: ['Tidak Sekolah', 'SD/Sederajat', 'SMP/Sederajat', 'SMA/Sederajat', 'D1/D2/D3', 'D4/S1', 'S2', 'S3'],
    pekerjaan: ['ASN', 'Ibu Rumah Tangga', 'Pelajar/Mahasiswa', 'Petani/Nelayan', 'POLRI', 'Swasta', 'TNI', 'Wiraswasta', 'Pekerja Lepas/Freelance', 'Tidak Kerja'],
    disab: ['Disabilitas', 'Non Disabilitas']
  };
  function pivot(recs, field, order) {
    var map = {}, keys = [];
    recs.forEach(function (r) {
      var v = r[field]; if (v == null || v === '') return;
      var nk = norm(v), found = null;
      for (var j = 0; j < keys.length; j++) if (norm(keys[j]) === nk) { found = keys[j]; break; }
      if (!found) { found = v; (order || []).forEach(function (o) { if (norm(o) === nk) found = o; }); keys.push(found); map[found] = 0; }
      map[found]++;
    });
    var ord = order || [];
    keys.sort(function (a, b) {
      var ia = ord.indexOf(a), ib = ord.indexOf(b);
      if (ia < 0) ia = 999; if (ib < 0) ib = 999;
      return ia - ib;
    });
    var tot = 0; keys.forEach(function (k) { tot += map[k]; });
    return { rows: keys.map(function (k) { return { label: k, n: map[k], pct: tot ? map[k] / tot : 0 }; }), total: tot };
  }

  /* Analisis lengkap */
  function analyze(rows, opt) {
    opt = opt || {};
    var tw = opt.tw || 4, list = opt.layanan || LAYANAN_TW[tw];
    var recs = rows.filter(function (r) { return isDataRow(r); }).map(function (r) { return processRow(r, list); });
    recs.forEach(function (r, i) { r.no = i + 1; });
    var all = computeBlock(recs);
    // per layanan: urutan daftar triwulan, ditambah layanan lain yang muncul di data
    var names = list.slice();
    recs.forEach(function (r) { if (r.layanan && names.indexOf(r.layanan) < 0) names.push(r.layanan); });
    var perLayanan = names.map(function (nm) {
      var rr = recs.filter(function (r) { return r.layanan === nm; });
      var b = computeBlock(rr); b.name = nm; b.inList = list.indexOf(nm) >= 0; return b;
    });
    var disTypes = pivot(recs.filter(function (r) { return r.disab === 'Disabilitas'; }), 'jenisDisab');
    var rentan = disTypes.rows.map(function (d) {
      var b = computeBlock(recs.filter(function (r) { return r.jenisDisab && norm(r.jenisDisab) === norm(d.label); })); b.name = d.label; return b;
    });
    var rentanAll = computeBlock(recs.filter(function (r) { return r.disab === 'Disabilitas'; }));
    return {
      recs: recs, all: all, perLayanan: perLayanan, rentan: rentan, rentanAll: rentanAll,
      pivots: {
        layanan: { rows: perLayanan.filter(function (b) { return b.n > 0 || b.inList; }).map(function (b) { return { label: b.name, n: b.n, pct: recs.length ? b.n / recs.length : 0 }; }), total: recs.length },
        jk: pivot(recs, 'jk', ORDER.jk), pendidikan: pivot(recs, 'pendidikan', ORDER.pendidikan),
        pekerjaan: pivot(recs, 'pekerjaan', ORDER.pekerjaan), usia: pivot(recs, 'usia'),
        disab: pivot(recs, 'disab', ORDER.disab), jenisDisab: disTypes
      },
      saran: recs.filter(function (r) { return r.saran && r.saran.replace(/[^a-z]/gi, '').length > 2; }).map(function (r) { return { nama: r.nama, layanan: r.layanan, text: r.saran }; })
    };
  }

  /* Rumus sampel (sheet "Rumus Perhitungan Sampel"): Krejcie & Morgan,
     X² = 3,841 ; P = 0,5 ; d = 0,05 */
  function sampleSize(N) {
    N = Number(N) || 0; if (N <= 0) return { num: 0, den: 0, s: 0 };
    var num = 3.841 * N * 0.25, den = 0.0025 * (N - 1) + 3.841 * 0.25;
    return { num: num, den: den, s: num / den };
  }

  /* Peringkat unsur (nilai konversi), stabil berdasarkan urutan U */
  function rankUnsur(unsurK) {
    var arr = UNSUR.map(function (u, i) { return { i: i, k: u.k, name: u.name, short: u.short, v: unsurK[i] }; }).filter(function (x) { return x.v != null; });
    return arr.sort(function (a, b) { return (b.v - a.v) || (a.i - b.i); });
  }

  /* Format angka Indonesia (koma desimal) atau titik (seperti contoh laporan) */
  function fmt(v, d, sep) {
    if (v == null || isNaN(v)) return '–';
    var s = Number(v).toFixed(d == null ? 2 : d);
    return sep === ',' ? s.replace('.', ',') : s;
  }
  function pct(v, d) { return v == null || isNaN(v) ? '–' : (v * 100).toFixed(d == null ? 2 : d) + '%'; }

  function periodeText(tw, tahun) { var b = BULAN_TW[tw]; return b[0] + ' s.d. ' + b[1] + ' Tahun ' + tahun; }
  function prevTW(tw, tahun) { return tw > 1 ? { tw: tw - 1, tahun: tahun } : { tw: 4, tahun: tahun - 1 }; }
  function terbilang(n) {
    var s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
    n = Math.floor(Math.abs(n));
    if (n < 12) return s[n]; if (n < 20) return terbilang(n - 10) + ' belas';
    if (n < 100) return terbilang(Math.floor(n / 10)) + ' puluh' + (n % 10 ? ' ' + terbilang(n % 10) : '');
    if (n < 200) return 'seratus' + (n - 100 ? ' ' + terbilang(n - 100) : '');
    if (n < 1000) return terbilang(Math.floor(n / 100)) + ' ratus' + (n % 100 ? ' ' + terbilang(n % 100) : '');
    return String(n);
  }

  return {
    COLS: COLS, QUESTIONS: QUESTIONS, Q0: Q0, UNSUR: UNSUR, ITEM_UNSUR: ITEM_UNSUR, SPAK_ITEMS: SPAK_ITEMS, SPKP_ITEMS: SPKP_ITEMS,
    LAYANAN_TW: LAYANAN_TW, LAYANAN_6: LAYANAN_6, BULAN_TW: BULAN_TW, ROMAWI: ROMAWI, BULAN: BULAN, ORDER: ORDER,
    score: score, SCORE_LABEL: SCORE_LABEL, mutu4: mutu4, mutuK: mutuK, MUTU_LABEL: MUTU_LABEL,
    norm: norm, canonLayanan: canonLayanan, isRowEmpty: isRowEmpty, isDataRow: isDataRow, processRow: processRow,
    computeBlock: computeBlock, analyze: analyze, pivot: pivot, sampleSize: sampleSize, rankUnsur: rankUnsur,
    fmt: fmt, pct: pct, periodeText: periodeText, prevTW: prevTW, terbilang: terbilang, mean: mean
  };
})();
if (typeof module !== 'undefined') module.exports = SKM;

</script>
<script>
/* ====================================================================
   OlahSKM — teks baku & draf narasi otomatis (tanpa DOM)
   ==================================================================== */
var NARASI = (function () {
  'use strict';
  var S = (typeof SKM !== 'undefined') ? SKM : require('./core.js');
  var f = function (v) { return S.fmt(v, 2); };

  function joinID(arr) { if (arr.length <= 1) return arr.join(''); return arr.slice(0, -1).join(', ') + ', serta ' + arr[arr.length - 1]; }
  function joinDan(arr) { if (arr.length <= 1) return arr.join(''); return arr.slice(0, -1).join(', ') + ', dan ' + arr[arr.length - 1]; }

  /* Kalimat baku per unsur — dipakai untuk draf 2.2.2 */

  function buildParams(kind) {
    var A = analysis(), s = st(), R = state.rep, T = state.tl, p = prevInfo();
    var P = { st: s, prev: { tw: p.tw, tahun: p.tahun, u: p.u, ikm: p.ikm }, prevTrendUp: p.trendUp, ttd: Object.assign({}, state.shared.ttd, { tanggal: kind === 'skm' ? R.tanggal : T.tanggal }),
      prevLowPara: state.shared.prevLowPara, actionPara: state.shared.actionPara,
      realisasi: state.shared.realisasi.map(function (r) { return Object.assign({}, r, { dokImgs: (r.dok || []).map(imgData).filter(Boolean) }); }), img: { logo: imgData(R.logo) } };
    if (kind === 'skm') {
      Object.assign(P, { jadwal: R.jadwal, resp15: R.resp15, layananNarasi: R.layananNarasi, unsurNarasi: R.unsurNarasi, analLow: R.analLow, analHigh: R.analHigh,
        masukan: R.masukan, analPenutup: R.analPenutup, trenText: R.trenText, trenSeries: trenSeries(s.tahun), kes: R.kes });
      P.img.cover = imgData(R.cover);
      if (typeof Chart !== 'undefined') {
        P.img.unsur = imgData(chartPNG(chartUnsurCfg(A, true), 1400, 700));
        P.img.tren = imgData(chartPNG(chartTrenCfg(trenSeries(s.tahun), true), 1400, 640));
      }
      P.img.layanan = {}; A.perLayanan.filter(function (b) { return b.n > 0; }).forEach(function (b) { P.img.layanan[b.name] = imgData(layananTablePNG(b)); });
      P.img.lampKues = R.lampKues.map(imgData); P.img.lampDok = R.lampDok.map(imgData);
    } else {
      Object.assign(P, { latar3: T.latar3, rtl: T.rtl, kes1: T.kes1, upaya: T.upaya, tantangan: T.tantangan, strategi: T.strategi, penutup: T.penutup });
      P.img.cover = imgData(T.cover);
    }
    return P;
  }
  function fixDocx(blob) { // nomor unik untuk setiap gambar (wp:docPr) agar Word tidak meminta perbaikan dokumen
    if (typeof JSZip === 'undefined') return Promise.resolve(blob);
    return JSZip.loadAsync(blob).then(function (z) {
      return z.file('word/document.xml').async('string').then(function (xml) {
        var n = 0; xml = xml.replace(/<wp:docPr id="\d+"/g, function () { n++; return '<wp:docPr id="' + n + '"'; });
        z.file('word/document.xml', xml);
        return z.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression: 'DEFLATE' });
      });
    }).catch(function () { return blob; });
  }
  function generate(kind) {
    if (typeof docx === 'undefined') return toast('Pustaka pembuat Word belum termuat. Periksa koneksi internet lalu muat ulang halaman.', 5000);
    var A = analysis();
    busy(true, 'Menyusun ' + (kind === 'skm' ? 'Laporan SKM' : 'Laporan Tindak Lanjut') + '…');
    setTimeout(function () {
      try {
        var P = buildParams(kind);
        var doc = kind === 'skm' ? REPORT.buildSKM(docx, A, P) : REPORT.buildTL(docx, A, P);
        docx.Packer.toBlob(doc).then(fixDocx).then(function (blob) {
          var s = st(), p = prevInfo();
          var name = kind === 'skm' ? 'Laporan SKM Triwulan ' + S.ROMAWI[s.tw] + ' ' + s.tahun + ' - KPU Kabupaten Pacitan.docx'
            : 'Laporan Tindak Lanjut SKM Triwulan ' + S.ROMAWI[p.tw] + ' ' + p.tahun + ' - KPU Kabupaten Pacitan.docx';
          download(blob, name); busy(false); toast('Laporan diunduh: ' + name, 5000);
        }).catch(function (e) { busy(false); console.error(e); toast('Gagal menyusun dokumen: ' + e.message, 6000); });
      } catch (e) { busy(false); console.error(e); toast('Gagal menyusun dokumen: ' + e.message, 6000); }
    }, 30);
  }

  /* ---------------- ekspor / impor proyek ---------------- */
  function exportProject() {
    var blob = new Blob([JSON.stringify({ app: 'OlahSKM', saved: new Date().toISOString(), state: state })], { type: 'application/json' });
    download(blob, 'OlahSKM TW ' + S.ROMAWI[state.settings.tw] + ' ' + state.settings.tahun + '.json');
    toast('Berkas proyek diunduh. Simpan di OneDrive bersama agar bisa dibuka rekan.');
  }
  function importProject(e) {
    var f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    f.text().then(function (t) {
      var o = JSON.parse(t); if (!o || o.app !== 'OlahSKM' || !o.state) throw new Error('Bukan berkas proyek OlahSKM');
      state = merge(defaultState(), o.state); G.undo = []; changed(); $('#selTw').value = state.settings.tw; $('#selTh').value = state.settings.tahun; render();
      toast('Proyek dibuka: ' + perLabel(state.settings.tw, state.settings.tahun) + ', ' + state.rows.length + ' baris.');
    }).catch(function (err) { toast('Gagal membuka proyek: ' + err.message, 5000); });
  }

  /* ---------------- mulai ---------------- */
  window.addEventListener('hashchange', render);
  window.addEventListener('beforeunload', function () { if (DB) idbPut('state', state); });
  idb().then(function () { return idbGet('state'); }).then(function (saved) {
    if (saved && saved.v) state = merge(defaultState(), saved);
    ensureYear(String(state.settings.tahun));
    shell(); render();
    if (!DB) setSaveUI('Penyimpanan peramban tidak tersedia — gunakan Ekspor proyek', true);
    else setSaveUI(saved ? 'Data terakhir dimuat' : 'Siap');
  });
  window.OlahSKM = { state: function () { return state; }, analysis: analysis, pasteText: pasteText, generate: generate, buildParams: buildParams, selectCell: selectCell };
})();

</script>
</body>
